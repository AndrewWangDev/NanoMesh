name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in NanoMesh"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please do NOT use this form for security vulnerabilities. Report security issues confidentially via [Security Policy](../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "e.g., WebGPU node fails to yield stream chunks when..."
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: "Affected Component"
      options:
        - "Browser WebGPU Runtime"
        - "Edge Worker Gateway & Orchestrator"
        - "DAG Graph Visualization (Canvas/SVG)"
        - "WebAuthn / Passkey Authentication"
        - "Credit Reservation & Billing"
        - "Cloudflare D1 / R2 Storage"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Please share minimal steps to reproduce the behavior."
      placeholder: |
        1. Open chat on '...'
        2. Prompt with '...'
        3. Observe error...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Environment Details"
      description: "Browser version, OS, GPU model (especially for WebGPU issues)."
      placeholder: "e.g., Chrome 124.0, macOS Sonoma 14.4, Apple M2 Max"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs or Error Output"
      description: "Paste browser console logs, network payloads, or worker errors."
      render: shell
