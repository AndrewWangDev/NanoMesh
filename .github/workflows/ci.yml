name: CI Quality Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Explicitly declare least privilege permissions at top level
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Static Analysis & Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck for Source (Zero Errors Allowed)
        run: npm run typecheck

      - name: Run Typecheck for Test Suites (Zero Errors Allowed)
        run: npm run typecheck:test

      - name: Lint Codebase (ESLint)
        run: npm run lint

      - name: Check Code Formatting (Prettier)
        run: npm run format:check

  security-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Production Dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Audit Full Dependency Tree
        run: npm audit --audit-level=critical
        continue-on-error: true

  test:
    name: Local Unit & Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Test Suite
        run: npm test
